name: Deploy NEXORA AI to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "functions/**"
      - "index.html"
      - "vite.config.*"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-cloudflare-pages.yml"

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out NEXORA AI
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build NEXORA AI
        run: npm run build

      - name: Deploy production to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=nexora-ai --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a5c4e4218e2cfa4196341ae2edcb194f
